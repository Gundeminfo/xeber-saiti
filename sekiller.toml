# ═══════════════════════════════════════════════════════════════════
#  Xəbər şəkilləri: başlıqdakı sözə görə foto seçilir.
#
#  Bot başlığı yuxarıdan aşağı bu siyahı ilə yoxlayır və İLK uyğun mövzunun
#  fotolarından birini götürür. Heç bir mövzu uyğun gəlməsə, xəbər şəkilsiz qalır.
#  Bu, yanlış şəkil qoymaqdan yaxşıdır.
#
#  words  — başlıqda axtarılan sözlər (söz kökü kifayətdir: "yağış" → "yağışlı" də tapılır)
#  photos — foto linkləri. Boş siyahı = bu mövzuda şəkil qoyulmasın.
#
#  Fotolar Unsplash-dandır: pulsuz, kommersiya istifadəsinə icazə var.
#  Öz fotonuzu static/sekiller/ qovluğuna yükləyib "static/sekiller/ad.jpg" kimi yaza bilərsiniz.
# ═══════════════════════════════════════════════════════════════════

